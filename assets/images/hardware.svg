<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8C1515"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="cableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="420" rx="16" fill="url(#cardBg)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#334155" stroke-width="0.75" stroke-dasharray="4,6" opacity="0.4">
    <line x1="80" y1="40" x2="80" y2="380"/>
    <line x1="240" y1="40" x2="240" y2="380"/>
    <line x1="400" y1="40" x2="400" y2="380"/>
    <line x1="560" y1="40" x2="560" y2="380"/>
    <line x1="720" y1="40" x2="720" y2="380"/>
    <line x1="40" y1="120" x2="760" y2="120"/>
    <line x1="40" y1="220" x2="760" y2="220"/>
    <line x1="40" y1="320" x2="760" y2="320"/>
  </g>

  <!-- Stylized Knee Joint & Exoskeleton Structure -->
  <g transform="translate(180, 210)">
    <!-- Thigh Segment -->
    <line x1="-70" y1="-140" x2="0" y2="0" stroke="#64748b" stroke-width="20" stroke-linecap="round"/>
    <line x1="-70" y1="-140" x2="0" y2="0" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <!-- Shank / Calf Segment (flexed at 65 deg) -->
    <line x1="0" y1="0" x2="55" y2="130" stroke="#64748b" stroke-width="18" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="55" y2="130" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <!-- Soft Tissue Viscoelastic Layer (Faded Orange/Red band) -->
    <path d="M -85,-110 Q -10,-10 40,110" fill="none" stroke="#f43f5e" stroke-width="8" opacity="0.3" stroke-dasharray="6,4"/>

    <!-- Exoskeleton Motor / Winch Unit (Mounted on Thigh) -->
    <rect x="-105" y="-125" width="45" height="60" rx="8" fill="#1e1e24" stroke="url(#accentGrad)" stroke-width="3"/>
    <circle cx="-82" cy="-95" r="14" fill="#0f172a" stroke="#8C1515" stroke-width="2.5"/>
    <circle cx="-82" cy="-95" r="6" fill="#f43f5e"/>

    <!-- Cable Routing over Knee Cam -->
    <path d="M -82,-81 Q -15,-20 18,15 L 48,95" fill="none" stroke="url(#cableGrad)" stroke-width="4" filter="url(#glow)"/>

    <!-- Knee Pulley / Biological Axis -->
    <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="0" cy="0" r="7" fill="#38bdf8"/>
    
    <!-- Shifting Center of Rotation annotation -->
    <circle cx="9" cy="-6" r="4" fill="#fb7185"/>
    <line x1="0" y1="0" x2="9" y2="-6" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="16" y="-10" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">Δ Instantaneous Axis (STA)</text>

    <!-- Winch Tension Vector Arrow -->
    <path d="M -75,-60 L -60,-35" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="-160" y="-50" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">F_winch (Up to 100 Nm)</text>
  </g>

  <!-- Hardware Spec Callouts (Right Side) -->
  <g transform="translate(430, 70)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="310" height="34" rx="8" fill="#8C1515" opacity="0.25"/>
    <rect x="0" y="0" width="310" height="34" rx="8" fill="none" stroke="#8C1515" stroke-width="1.5"/>
    <text x="14" y="22" fill="#fecdd3" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">CUSTOM HIGH-FORCE KNEE EXOSKELETON</text>

    <!-- Metric 1 -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="310" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="28" cy="30" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="23" y="35" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">⚡</text>
      <text x="54" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Actuation Capacity</text>
      <text x="54" y="46" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="17" font-weight="700">100 Nm / Knee <tspan fill="#64748b" font-size="12" font-weight="normal">(Linear Winch)</tspan></text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(0, 128)">
      <rect x="0" y="0" width="310" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="28" cy="30" r="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="23" y="35" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">⚖️</text>
      <text x="54" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Device Weight</text>
      <text x="54" y="46" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="17" font-weight="700">~1.0 kg / Leg <tspan fill="#64748b" font-size="12" font-weight="normal">(Extreme 100:1 ratio)</tspan></text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(0, 201)">
      <rect x="0" y="0" width="310" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="28" cy="30" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
      <text x="23" y="35" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">🎯</text>
      <text x="54" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Inference Loop</text>
      <text x="54" y="46" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="17" font-weight="700">> 500 Hz <tspan fill="#64748b" font-size="12" font-weight="normal">(Embedded 4-layer MLP)</tspan></text>
    </g>
  </g>

  <!-- Bottom Blender Model Badge Callout -->
  <g transform="translate(40, 375)">
    <rect x="0" y="0" width="720" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="15" r="4" fill="#10b981"/>
    <text x="28" y="19" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Custom Hardware Architecture: Bypassing rigid-body errors by turning the robot into an active sensor.</text>
  </g>
</svg>
